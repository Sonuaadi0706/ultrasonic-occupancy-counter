<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1800" viewBox="0 0 2800 1800">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17202a"/></marker></defs>
<rect x="0" y="0" width="2800" height="1800" rx="0" fill="#f7f5ef" stroke="none" stroke-width="0"/>
<text x="70" y="70" font-family="DejaVu Sans" font-size="52" fill="#0f172a" font-weight="bold" text-anchor="start">UNO Counting State Machine</text>
<text x="72" y="108" font-family="DejaVu Sans" font-size="22" fill="#475569" font-weight="normal" text-anchor="start">Implemented in code/uno/room_counter/room_counter.ino  ·  sensor debounce → room/queue counting → LEDs, buzzer, UART</text>
<rect x="60" y="145" width="2680" height="300" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="183" font-family="DejaVu Sans" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">1 · SENSOR PRESENCE LAYER — runs in both modes</text>
<text x="88" y="211" font-family="DejaVu Sans" font-size="16" fill="#64748b" font-weight="normal" text-anchor="start">Reads A and B alternately every 60 ms. Presence is debounced; a rising edge is reported only once per approach.</text>
<rect x="100" y="235" width="520" height="160" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="122" y="266" font-family="DejaVu Sans" font-size="14" fill="#64748b" font-weight="bold" text-anchor="start">READ</text>
<text x="122" y="300" font-family="DejaVu Sans" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">One sensor per 60 ms</text>
<text x="122" y="330" font-family="DejaVu Sans" font-size="16" fill="#475569" font-weight="normal" text-anchor="start">A, then B, then A…</text>
<text x="122" y="354" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">pulseIn timeout 30 ms</text>
<text x="122" y="378" font-family="DejaVu Sans" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="start">invalid echo → fault = true</text>
<path d="M 635 315 L 705 315" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="720" y="235" width="650" height="160" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="742" y="266" font-family="DejaVu Sans" font-size="14" fill="#b45309" font-weight="bold" text-anchor="start">NEAR</text>
<text x="742" y="300" font-family="DejaVu Sans" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">distance ≤ threshold</text>
<text x="742" y="330" font-family="DejaVu Sans" font-size="16" fill="#475569" font-weight="normal" text-anchor="start">nearCount++  ·  clearCount = 0</text>
<text x="742" y="354" font-family="DejaVu Sans" font-size="16" fill="#475569" font-weight="normal" text-anchor="start">2 consecutive samples → active = true</text>
<text x="742" y="378" font-family="DejaVu Sans" font-size="15" fill="#b45309" font-weight="normal" text-anchor="start">rising edge → onSensorEdge(A/B)</text>
<path d="M 1385 315 L 1415 315" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1430" y="235" width="650" height="160" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="1452" y="266" font-family="DejaVu Sans" font-size="14" fill="#047857" font-weight="bold" text-anchor="start">CLEAR</text>
<text x="1452" y="300" font-family="DejaVu Sans" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">distance ≥ threshold + 12 cm</text>
<text x="1452" y="330" font-family="DejaVu Sans" font-size="16" fill="#475569" font-weight="normal" text-anchor="start">clearCount++  ·  nearCount = 0</text>
<text x="1452" y="354" font-family="DejaVu Sans" font-size="16" fill="#475569" font-weight="normal" text-anchor="start">3 consecutive samples → active = false</text>
<text x="1452" y="378" font-family="DejaVu Sans" font-size="15" fill="#047857" font-weight="normal" text-anchor="start">must clear before the next edge</text>
<path d="M 2095 315 L 2125 315" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="2140" y="235" width="520" height="160" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="2162" y="266" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="bold" text-anchor="start">HYSTERESIS BAND</text>
<text x="2162" y="300" font-family="DejaVu Sans" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">threshold &lt; distance</text>
<text x="2162" y="330" font-family="DejaVu Sans" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">&lt; threshold + 12</text>
<text x="2162" y="360" font-family="DejaVu Sans" font-size="16" fill="#475569" font-weight="normal" text-anchor="start">hold current state</text>
<text x="2162" y="384" font-family="DejaVu Sans" font-size="14" fill="#b91c1c" font-weight="normal" text-anchor="start">invalid echo also holds state</text>
<rect x="60" y="475" width="1900" height="1210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="513" font-family="DejaVu Sans" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">2 · ROOM MODE — directional state machine</text>
<text x="88" y="541" font-family="DejaVu Sans" font-size="16" fill="#64748b" font-weight="normal" text-anchor="start">A = outside, B = inside. A → B counts +1. B → A counts −1. Sequence state is reported as seq 0–4.</text>
<rect x="800" y="620" width="260" height="110" rx="18" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="930.0" y="654" font-family="DejaVu Sans" font-size="21" fill="#0f172a" font-weight="bold" text-anchor="middle">IDLE</text>
<text x="930.0" y="682" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">seq 0 · wait for first edge</text>
<rect x="260" y="880" width="270" height="120" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<text x="395.0" y="914" font-family="DejaVu Sans" font-size="21" fill="#92400e" font-weight="bold" text-anchor="middle">A_FIRST</text>
<text x="395.0" y="942" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">seq 1 · A seen</text>
<text x="395" y="1034" font-family="DejaVu Sans" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">wait for B · 1.5 s timer</text>
<rect x="1370" y="880" width="270" height="120" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
<text x="1505.0" y="914" font-family="DejaVu Sans" font-size="21" fill="#92400e" font-weight="bold" text-anchor="middle">B_FIRST</text>
<text x="1505.0" y="942" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">seq 2 · B seen</text>
<text x="1505" y="1034" font-family="DejaVu Sans" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">wait for A · 1.5 s timer</text>
<rect x="800" y="1130" width="260" height="110" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
<text x="930.0" y="1164" font-family="DejaVu Sans" font-size="21" fill="#1e3a8a" font-weight="bold" text-anchor="middle">WAIT_CLEAR</text>
<text x="930.0" y="1192" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">seq 3 · crossing counted</text>
<text x="930" y="1268" font-family="DejaVu Sans" font-size="13" fill="#1e3a8a" font-weight="bold" text-anchor="middle">ignore edges until both clear</text>
<rect x="1450" y="620" width="270" height="110" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
<text x="1585.0" y="654" font-family="DejaVu Sans" font-size="21" fill="#991b1b" font-weight="bold" text-anchor="middle">AMBIGUOUS</text>
<text x="1585.0" y="682" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle">seq 4 · both seen</text>
<text x="1585" y="770" font-family="DejaVu Sans" font-size="13" fill="#991b1b" font-weight="bold" text-anchor="middle">no count · emit INVALID</text>
<text x="1585" y="794" font-family="DejaVu Sans" font-size="13" fill="#991b1b" font-weight="bold" text-anchor="middle">ignore edges until both clear</text>
<path d="M 850 730 C 750 800 620 820 500 880" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="520" y="790" width="148.17999999999998" height="27" rx="8" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
<text x="594.09" y="808.63" font-family="DejaVu Sans" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">A rising, B clear</text>
<path d="M 1010 730 C 1110 800 1240 820 1370 880" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1160" y="790" width="148.17999999999998" height="27" rx="8" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/>
<text x="1234.09" y="808.63" font-family="DejaVu Sans" font-size="13" fill="#92400e" font-weight="bold" text-anchor="middle">B rising, A clear</text>
<path d="M 1060 675 L 1450 675" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1140" y="640" width="223.57999999999998" height="27" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1251.79" y="658.63" font-family="DejaVu Sans" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="middle">other sensor already active</text>
<path d="M 530 965 C 650 1050 740 1080 800 1170" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="560" y="1050" width="140.64" height="27" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="630.3199999999999" y="1068.63" font-family="DejaVu Sans" font-size="13" fill="#15803d" font-weight="bold" text-anchor="middle">B rising → +1 IN</text>
<path d="M 1370 965 C 1250 1050 1160 1080 1060 1170" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1130" y="1050" width="148.17999999999998" height="27" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1204.09" y="1068.63" font-family="DejaVu Sans" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="middle">A rising → −1 OUT</text>
<path d="M 930 1130 L 930 730" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="950" y="900" width="118.02" height="27" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="1009.01" y="918.63" font-family="DejaVu Sans" font-size="13" fill="#1d4ed8" font-weight="bold" text-anchor="middle">both inactive</text>
<path d="M 1585 620 C 1585 550 1250 540 930 540 C 900 540 900 580 930 620" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1180" y="520" width="118.02" height="27" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="1239.01" y="538.63" font-family="DejaVu Sans" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="middle">both inactive</text>
<rect x="100" y="1080" width="500" height="150" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="120" y="1112" font-family="DejaVu Sans" font-size="15" fill="#b45309" font-weight="bold" text-anchor="start">TIMEOUT</text>
<text x="120" y="1140" font-family="DejaVu Sans" font-size="14" fill="#7c2d12" font-weight="normal" text-anchor="start">A_FIRST or B_FIRST with no second</text>
<text x="120" y="1164" font-family="DejaVu Sans" font-size="14" fill="#7c2d12" font-weight="normal" text-anchor="start">edge within 1.5 s → IDLE</text>
<text x="120" y="1188" font-family="DejaVu Sans" font-size="14" fill="#7c2d12" font-weight="normal" text-anchor="start">emit TIMEOUT event</text>
<rect x="120" y="1260" width="650" height="205" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="142" y="1292" font-family="DejaVu Sans" font-size="14" fill="#15803d" font-weight="bold" text-anchor="start">IN ACTION</text>
<text x="142" y="1318" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="normal" text-anchor="start">count++ · totalIn++ · event IN</text>
<text x="142" y="1342" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="normal" text-anchor="start">green pulse · short beep</text>
<text x="142" y="1366" font-family="DejaVu Sans" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">if count ≥ capacity: FULL + long beep</text>
<text x="142" y="1398" font-family="DejaVu Sans" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="start">OUT ACTION</text>
<text x="142" y="1422" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="normal" text-anchor="start">count−− if &gt; 0; else INVALID</text>
<text x="142" y="1446" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="normal" text-anchor="start">totalOut++ · event OUT/INVALID</text>
<rect x="2000" y="475" width="740" height="1210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="2028" y="513" font-family="DejaVu Sans" font-size="24" fill="#0f172a" font-weight="bold" text-anchor="start">3 · QUEUE MODE</text>
<text x="2028" y="541" font-family="DejaVu Sans" font-size="16" fill="#64748b" font-weight="normal" text-anchor="start">Independent edge counting; no room sequence state.</text>
<rect x="2040" y="590" width="660" height="150" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
<text x="2070" y="628" font-family="DejaVu Sans" font-size="20" fill="#047857" font-weight="bold" text-anchor="start">A rising edge</text>
<text x="2070" y="660" font-family="DejaVu Sans" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">count++</text>
<text x="2070" y="688" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">totalIn++ · event IN</text>
<text x="2070" y="712" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">green pulse · short beep</text>
<text x="2070" y="736" font-family="DejaVu Sans" font-size="14" fill="#b45309" font-weight="normal" text-anchor="start">if count ≥ capacity: FULL + long beep</text>
<rect x="2040" y="790" width="660" height="150" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="2070" y="828" font-family="DejaVu Sans" font-size="20" fill="#b91c1c" font-weight="bold" text-anchor="start">B rising edge</text>
<text x="2070" y="860" font-family="DejaVu Sans" font-size="18" fill="#0f172a" font-weight="bold" text-anchor="start">count−− if count &gt; 0</text>
<text x="2070" y="888" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">else event INVALID; count stays 0</text>
<text x="2070" y="912" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">red pulse · OUT beeps</text>
<text x="2070" y="936" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="normal" text-anchor="start">totalOut++ always</text>
<rect x="2040" y="1000" width="660" height="170" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="2062" y="1032" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="bold" text-anchor="start">REARM RULE</text>
<text x="2062" y="1060" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">A sensor must go inactive before</text>
<text x="2062" y="1084" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">the same sensor can count again.</text>
<text x="2062" y="1114" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Debounce layer supplies the edge;</text>
<text x="2062" y="1138" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">queue mode does not use A_FIRST/B_FIRST.</text>
<rect x="2040" y="1220" width="660" height="190" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="2062" y="1252" font-family="DejaVu Sans" font-size="14" fill="#1d4ed8" font-weight="bold" text-anchor="start">MODE SWITCH</text>
<text x="2062" y="1280" font-family="DejaVu Sans" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">C,MODE,ROOM / QUEUE</text>
<text x="2062" y="1306" font-family="DejaVu Sans" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">resets room sequence to IDLE</text>
<text x="2062" y="1330" font-family="DejaVu Sans" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">count, totals and threshold stay</text>
<text x="2062" y="1354" font-family="DejaVu Sans" font-size="15" fill="#334155" font-weight="normal" text-anchor="start">blue LED = count ≥ capacity</text>
<rect x="60" y="1710" width="2680" height="60" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="82" y="1745" font-family="DejaVu Sans" font-size="14" fill="#1d4ed8" font-weight="bold" text-anchor="start">READING THE DIAGRAM</text>
<text x="300" y="1745" font-family="DejaVu Sans" font-size="14" fill="#1e3a8a" font-weight="normal" text-anchor="start">Solid arrows = counted transitions. The TIMEOUT box = rejected crossing. seq values match the S,... UART field. A/B are the debounced active states.</text>
</svg>